trigger:
  branches:
    include:
    - features/F108-calendar
  paths:
    include:
    - 'uni-flow/**'

variables:
- name: WORKDIR
  value: 'uni-flow'

stages:
- stage: BuildReact
  displayName: "React.js build"
  pool:
    vmImage: ubuntu-latest
  jobs:
  - job: Build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'
    - task: CmdLine@2
      displayName: 'Install and Build'
      inputs:
        script: |
          cd uni-flow
          npm install
          npm run build
        workingDirectory: uni-flow

- stage: DownloadComponents
  displayName: "Component download"
  pool:
    vmImage: ubuntu-latest
  jobs:
  - job: Download
    steps:
    - task: CmdLine@2
      inputs:
        script: |
          npm install @fullcalendar/core @fullcalendar/daygrid @fullcalendar/timegrid @fullcalendar/list
          npm install --save @fullcalendar/core @fullcalendar/react @fullcalendar/daygrid
          npm install --save @fullcalendar/timegrid @fullcalendar/interaction
      displayName: 'Calendar component download'
    
- stage: Test
  displayName: "Run Tests"
  pool:
    vmImage: ubuntu-latest
  jobs:
  - job: RunTests
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'
    - task: CmdLine@2
      displayName: 'Run tests'
      inputs:
        script: |
          cd uni-flow
          npm run test --if-present
