# Next.js (SSR) → Azure App Service (Linux, Node 22 LTS)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 'uni-flow/**'

pool:
  vmImage: ubuntu-latest

variables:
  WORKDIR: 'uni-flow'
  ARTIFACT_NAME: 'drop'
  NODE_VERSION: '22.x'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Use Node.js $(NODE_VERSION)'

  - task: Cache@2
    displayName: 'Cache npm based on package-lock.json'
    inputs:
      key: 'npm | "$(Agent.OS)" | "$(WORKDIR)/package-lock.json"'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: ~/.npm

  - script: |
      npm ci
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Install deps (npm ci)'

  - script: |
      export NEXT_TELEMETRY_DISABLED=1
      npm run build
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Build Next.js'

  - script: |
      npm prune --production
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Prune to production deps'

  - task: ArchiveFiles@2
    displayName: 'Archive build output'
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'
      ArtifactName: '$(ARTIFACT_NAME)'
      publishLocation: 'Container'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure App Service'
    inputs:
      azureSubscription: 'AppServiceConnection'
      appType: 'webAppLinux'
      appName: 'UniFlowASD'
      package: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'
      runtimeStack: 'NODE|22-lts'
