# Next.js (SSR) → Azure App Service (Linux, Node 22 LTS)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 'uni-flow/**'

pool:
  vmImage: ubuntu-latest

variables:
  WORKDIR: 'uni-flow'
  ARTIFACT_NAME: 'drop'
  NODE_VERSION: '20.x'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Use Node.js $(NODE_VERSION)'

  - script: |
      npm ci
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Install deps (npm ci)'

  - script: |
      npx prisma generate
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Prisma generate'

  - script: |
      export NEXT_TELEMETRY_DISABLED=1
      npm run build
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Build Next.js'

  - script: |
      set -e
      echo "Check .next exists"
      test -d .next || (echo ".next folder is missing" && exit 1)

      echo "Check next runtime file exists"
      test -f node_modules/next/dist/server/next.js || (echo "node_modules/next/dist/server/next.js is missing" && ls -la node_modules/next || true && exit 1)

      echo "Show top-level for sanity:"
      ls -la
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Verify runtime files (.next & next)'

  - task: ArchiveFiles@2
    displayName: 'Archive standalone bundle'
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'
      tarPatternToExclude: |
        **/*
        !.next/standalone/**
        !.next/static/**
        !public/**
        !package.json
        
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'
      ArtifactName: '$(ARTIFACT_NAME)'
      publishLocation: 'Container'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure App Service'
    inputs:
      azureSubscription: 'AppServiceConnection'
      appType: 'webAppLinux'
      appName: 'UniFlowASD'
      package: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'
      runtimeStack: 'NODE|20-lts'
      startupCommand: 'node .next/standalone/server.js'
