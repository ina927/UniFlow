# Next.js (SSR) → Azure App Service (Linux, Node 22 LTS)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 'uni-flow/**'

pool:
  vmImage: ubuntu-latest

variables:
  WORKDIR: 'uni-flow'
  ARTIFACT_NAME: 'drop'
  NODE_VERSION: '20.x'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '$(NODE_VERSION)'
    displayName: 'Use Node.js $(NODE_VERSION)'

  - script: |
      npm ci
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Install deps (npm ci)'

  - script: |
      npx prisma generate
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Prisma generate'

  - script: |
      export NEXT_TELEMETRY_DISABLED=1
      npm run build
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Build Next.js'
  
  - script: |
      set -e
      DEPLOY_DIR="$(Build.ArtifactStagingDirectory)/deploy"
      rm -rf "$DEPLOY_DIR"
      mkdir -p "$DEPLOY_DIR/.next"

      cp -R .next/standalone/* "$DEPLOY_DIR"/

      cp -R .next/static "$DEPLOY_DIR/.next/"

      if [ -d public ]; then
        cp -R public "$DEPLOY_DIR/public"
      fi

      cp package.json "$DEPLOY_DIR/"

      echo "=== Deploy folder tree ==="
      find "$DEPLOY_DIR" -maxdepth 3 -type d -print
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Stage standalone build into deploy dir'

  - script: |
      set -e
      DEPLOY_DIR="$(Build.ArtifactStagingDirectory)/deploy"
      test -f "$DEPLOY_DIR/server.js" || (echo "server.js missing in deploy root" && exit 1)
      test -d "$DEPLOY_DIR/.next/static" || (echo ".next/static missing in deploy" && exit 1)
      ls -la "$DEPLOY_DIR" | sed -n '1,120p'
      ls -la "$DEPLOY_DIR/.next" | sed -n '1,120p'
      ls -la "$DEPLOY_DIR/.next/static" | sed -n '1,60p'
    displayName: 'Verify deploy dir content'

  - task: ArchiveFiles@2
    displayName: 'Archive standalone bundle'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/deploy'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'
      replaceExistingArchive: true

        
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'
      ArtifactName: '$(ARTIFACT_NAME)'
      publishLocation: 'Container'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure App Service'
    inputs:
      azureSubscription: 'AppServiceConnection'
      appType: 'webAppLinux'
      appName: 'UniFlowASD'
      package: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'
      runtimeStack: 'NODE|20-lts'
      startupCommand: 'node server.js'
