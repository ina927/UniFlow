trigger:
  branches:
    include: [ features/F110-Study_Session_History ]
  paths:
    include:
      - 'uni-flow/**'

pool:
  vmImage: ubuntu-latest

variables:
  WORKDIR: 'uni-flow'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Use Node.js 20'

  - script: |
      npm ci
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Install deps (npm ci)'

  - script: |
      export NEXT_TELEMETRY_DISABLED=1
      npm run build -- --no-lint
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Build Next.js (no lint)'

  - script: |
      npm run test --if-present
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Run tests'
