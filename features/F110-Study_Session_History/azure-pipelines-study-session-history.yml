trigger:
  branches:
    include: [ features/F110-Study_Session_History ]
  paths:
    include:
      - 'uni-flow/**'

pool:
  vmImage: ubuntu-latest

variables:
  WORKDIR: 'uni-flow'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Use Node.js 20'

  - script: |
      npm ci
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Install deps (npm ci)'

  - script: |
      npx vitest run
    workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKDIR)'
    displayName: 'Run tests'
